# Tool settings only. Dependencies are in requirements.txt; tests are configured in pytest.ini.
[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = [
    "E501",  # long lines are left to black
    "B905",  # zip(path, path[1:]) is intentionally uneven
]
