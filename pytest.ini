[pytest]
# Bare `pytest` (or `python -m pytest`) from the repo root must only ever
# collect the active digital_twin/ test suite. Without this, pytest's
# default recursive discovery also picks up legacy/*/tests/, which fail
# collection (their imports assume a package layout that predates this
# repo's reorganization) -- confusing anyone who just types `pytest` and
# sees a wall of errors that have nothing to do with the active system.
testpaths = tests
