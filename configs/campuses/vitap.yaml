# VIT-AP Campus Configuration v2.0 - FIXED & COMPLETE
# =====================================================
# IMPROVEMENTS:
# ✅ Gate & parking lot have DIFFERENT coordinates (no conflict)
# ✅ Multiple parking lots (5 total) for realistic multi-lot optimization
# ✅ Travel times calibrated to vehicle speed (5 m/s = 18 km/h campus speed)
# ✅ Complete bidirectional road network (no orphaned nodes)
# ✅ Reverse edges so vehicles can return
# ✅ All capacity values realistic and non-zero
# ✅ All foreign keys valid, no NULL values

campus:
  campus_id: vitap
  name: VIT-AP University
  description: Amaravati, Andhra Pradesh, India. Complete campus model with multiple parking zones.
  timezone: Asia/Kolkata
  configuration_version: VITAP_CONFIG_V2

# =====================================================
# GATES (Entry/Exit Points) - 2 gates for realism
# =====================================================
gates:
  # Main gate - entrance to main campus area
  - gate_id: vitap-gate-main
    name: "Main Gate"
    latitude: 16.4911715
    longitude: 80.5018052
    capacity: 40
    status: open
    metadata:
      gate_type: "main"
      vehicle_types: ["car", "two-wheeler", "bus"]
      entry_exit_direction: "bidirectional"
      peak_throughput_per_hour: 150

  # Visitor/Secondary gate
  - gate_id: vitap-gate-visitor
    name: "Visitor Gate"
    latitude: 16.4895000
    longitude: 80.4960000
    capacity: 25
    status: open
    metadata:
      gate_type: "visitor"
      vehicle_types: ["car", "two-wheeler"]
      entry_exit_direction: "bidirectional"
      peak_throughput_per_hour: 80

# =====================================================
# PARKING LOTS (5 zones with realistic capacities)
# =====================================================
parking_lots:
  # Zone A: Main academic block parking
  - parking_lot_id: vitap-lot-academic-main
    name: "Academic Block Main Lot"
    latitude: 16.493500
    longitude: 80.499500
    zone: "academic_zone"
    boundary_polygon: "POLYGON((16.493000 80.499000, 16.494000 80.499000, 16.494000 80.500000, 16.493000 80.500000, 16.493000 80.499000))"
    total_capacity: 120
    usable_capacity: 108
    reserved_capacity: 8
    restricted_capacity: 4
    temporarily_unavailable_capacity: 0
    status: open
    metadata:
      lot_type: "faculty_and_students"
      access_level: "all"
      vehicle_types: ["car", "two-wheeler"]

  # Zone B: Hostel parking (large lot)
  - parking_lot_id: vitap-lot-hostel
    name: "Hostel Zone Parking"
    latitude: 16.491500
    longitude: 80.500800
