# Synthetic Large Campus - Generalization Proof
# ================================================
# Purpose: Demonstrates that the config loader & graph service work
# with a DIFFERENT topology (3 gates, 6 lots, new coordinate system)
# with ZERO code changes. Purely synthetic for testing scalability.

campus:
  campus_id: synthetic_large
  name: Synthetic Large Campus
  description: Fabricated multi-gate, multi-lot test campus to verify generalization
  timezone: UTC
  configuration_version: SYNTHETIC_LARGE_V1

# =====================================================
# GATES (3 entry points - different from sample/vitap)
# =====================================================
gates:
  - gate_id: syn-gate-north
    name: "North Gate"
    latitude: 20.0000
    longitude: 75.0000
    capacity: 50
    status: open
    metadata:
      gate_type: "main"
      peak_throughput_per_hour: 180

  - gate_id: syn-gate-south
    name: "South Gate"
    latitude: 19.9700
    longitude: 75.0100
    capacity: 40
    status: open
    metadata:
      gate_type: "secondary"
      peak_throughput_per_hour: 120

  - gate_id: syn-gate-east
    name: "East Gate"
    latitude: 19.9850
    longitude: 75.0300
    capacity: 35
    status: open
    metadata:
      gate_type: "service"
      peak_throughput_per_hour: 90

# =====================================================
# PARKING LOTS (6 zones - different sizes & locations)
# =====================================================
parking_lots:
  - parking_lot_id: syn-lot-north-primary
    name: "North Primary Lot"
    latitude: 19.9950
    longitude: 75.0050
    zone: "north_zone"
    total_capacity: 150
    usable_capacity: 135
    reserved_capacity: 10
    restricted_capacity: 5
    temporarily_unavailable_capacity: 0
    status: open

  - parking_lot_id: syn-lot-north-secondary
    name: "North Secondary Lot"
    latitude: 19.9900
    longitude: 75.0080
    zone: "north_zone"
    total_capacity: 100
    usable_capacity: 90
    reserved_capacity: 7
    restricted_capacity: 3
    temporarily_unavailable_capacity: 0
    status: open

  - parking_lot_id: syn-lot-central
    name: "Central Lot"
    latitude: 19.9850
    longitude: 75.0100
    zone: "central_zone"
    total_capacity: 200
    usable_capacity: 180
    reserved_capacity: 15
    restricted_capacity: 5
    temporarily_unavailable_capacity: 0
    status: open

  - parking_lot_id: syn-lot-south-primary
    name: "South Primary Lot"
    latitude: 19.9750
    longitude: 75.0120
    zone: "south_zone"
    total_capacity: 140
    usable_capacity: 126
    reserved_capacity: 10
    restricted_capacity: 4
    temporarily_unavailable_capacity: 0
    status: open

  - parking_lot_id: syn-lot-south-secondary
    name: "South Secondary Lot"
    latitude: 19.9700
    longitude: 75.0080
    zone: "south_zone"
    total_capacity: 90
    usable_capacity: 81
    reserved_capacity: 6
    restricted_capacity: 3
    temporarily_unavailable_capacity: 0
    status: open

  - parking_lot_id: syn-lot-east
    name: "East Lot"
    latitude: 19.9900
    longitude: 75.0250
    zone: "east_zone"
    total_capacity: 110
    usable_capacity: 99
    reserved_capacity: 8
    restricted_capacity: 3
    temporarily_unavailable_capacity: 0
    status: open

# =====================================================
# DESTINATIONS (6 buildings across zones)
# =====================================================
destinations:
  - destination_id: syn-dest-north-academic
    name: "North Academic Building"
    category: academic_block
    latitude: 19.9960
    longitude: 75.0040
    nearest_gate_ids: [syn-gate-north, syn-gate-east]
    nearest_parking_lot_ids: [syn-lot-north-primary, syn-lot-north-secondary]

  - destination_id: syn-dest-north-admin
    name: "North Administrative Office"
    category: administrative_building
    latitude: 19.9920
    longitude: 75.0070
    nearest_gate_ids: [syn-gate-north]
    nearest_parking_lot_ids: [syn-lot-north-secondary, syn-lot-north-primary]

  - destination_id: syn-dest-central-hub
    name: "Central Hub"
    category: academic_block
    latitude: 19.9850
    longitude: 75.0100
    nearest_gate_ids: [syn-gate-north, syn-gate-south, syn-gate-east]
    nearest_parking_lot_ids: [syn-lot-central, syn-lot-north-primary, syn-lot-south-primary]

  - destination_id: syn-dest-south-academic
    name: "South Academic Building"
    category: academic_block
    latitude: 19.9760
    longitude: 75.0130
    nearest_gate_ids: [syn-gate-south, syn-gate-east]
    nearest_parking_lot_ids: [syn-lot-south-primary, syn-lot-central]

  - destination_id: syn-dest-south-hostel
    name: "South Hostel Complex"
    category: hostel
    latitude: 19.9710
    longitude: 75.0090
    nearest_gate_ids: [syn-gate-south]
    nearest_parking_lot_ids: [syn-lot-south-secondary, syn-lot-south-primary]

  - destination_id: syn-dest-east-facility
