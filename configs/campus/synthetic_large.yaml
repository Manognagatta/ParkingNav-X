# EVENTS (optional scenario triggers)
# =====================================================
events:
  - event_id: syn-event-peak
    event_type: peak_hours
    name: "Peak Hours"
    start_time: "2026-10-06T08:00:00Z"
    end_time: "2026-10-06T10:00:00Z"
    expected_demand_multiplier: 1.8
    affected_zones: [north_zone, central_zone, south_zone]
    status: scheduled

  - event_id: syn-event-exam
    event_type: exam
    name: "Exam Period"
    start_time: "2026-10-15T08:00:00Z"
    end_time: "2026-10-20T18:00:00Z"
    expected_demand_multiplier: 2.0
