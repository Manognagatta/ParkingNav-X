    expected_travel_time_seconds: 110
    is_walkable: true
    is_driveable: true
    status: open
    geometry:
      - { lat: 10.0000, lng: 20.0000 }
      - { lat: 10.0010, lng: 20.0003 }
      - { lat: 10.0020, lng: 20.0005 }
  - road_id: sample-road-3
    name: Lot 1 to Destination 1
    start_node_id: sample-lot-1
    end_node_id: sample-dest-1
