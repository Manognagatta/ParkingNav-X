    event_type: exam
    name: Sample Exam Week
    start_time: "2026-10-01T00:00:00Z"
    end_time: "2026-10-05T00:00:00Z"
    expected_demand_multiplier: 1.5
    affected_zones: [sample-lot-1]
    status: scheduled

roads:
  - road_id: sample-road-1
    name: Gate to Lot 1
    start_node_id: sample-gate-1
    end_node_id: sample-lot-1
    length_meters: 120
    expected_travel_time_seconds: 90
    is_walkable: true
    is_driveable: true
    status: open
    geometry:
      - { lat: 10.0000, lng: 20.0000 }
      - { lat: 10.0005, lng: 20.0005 }
      - { lat: 10.0010, lng: 20.0010 }
  - road_id: sample-road-2
    name: Gate to Lot 2
    start_node_id: sample-gate-1
    end_node_id: sample-lot-2
