# SAMPLE campus config — fabricated development placeholder. Never real.
campus:
  campus_id: sample
  name: Sample Campus
  description: Fully fabricated development/test campus.
  timezone: UTC
  configuration_version: SAMPLE_CONFIG_V1

gates:
  - gate_id: sample-gate-1
    name: Sample Gate 1
    latitude: 10.0000
    longitude: 20.0000
    capacity: 10
    status: open

parking_lots:
  - parking_lot_id: sample-lot-1
    name: Sample Lot 1
    latitude: 10.0010
    longitude: 20.0010
    total_capacity: 20
    usable_capacity: 18
    status: open
  - parking_lot_id: sample-lot-2
    name: Sample Lot 2
    latitude: 10.0020
    longitude: 20.0005
    total_capacity: 15
    usable_capacity: 15
    status: open

destinations:
  - destination_id: sample-dest-1
