# Coordinates derived from the real VIT-AP campus layout image.
# Campus center: ~16.4928°N, 80.4994°E (Amaravati, AP)
# Map spans: lat 16.4888–16.4968 (N-S ~890m), lng 80.4940–80.5038 (E-W ~930m)
#
# COORDINATE LAYOUT (from the real campus map):
#   North (top):  Main Gate at lat≈16.4961
#   East (right): Alternative Gate at lat≈16.4930, lng≈80.5035
#   SW (left):    Sports & Recreation Lot
#   SE (lower):   Hostel Zone Parking, MH blocks, LH blocks
# =========================================================

campus:
  campus_id: vitap
  name: VIT-AP University
  description: Amaravati, Andhra Pradesh, India. Complete campus model with multiple parking zones.
  timezone: Asia/Kolkata
  configuration_version: VITAP_CONFIG_V3_REALMAP

