# E4: Gate closure — main gate closed ticks 45–105 (08:45–09:45)
# Tests: no arrivals via gate-main during closure; arrivals diverted to visitor gate;
#        gate-main resumes at tick 105; queue buildup at visitor gate during peak.
# Same base as E1 (600-min, 400-vehicle, E1 profile); only difference is timed gate closure.
scenario_id: vitap-gate-closure
campus_id: vitap
name: GATE_CLOSURE
description: "Main gate closed ticks 45-105 (08:45-09:45); traffic via visitor gate during closure"
duration_minutes: 600
vehicle_count: 400
start_time_min: 480

arrival_rate_profile:
  type: profile
  points:
    - { time: 0,   rate: 0.3 }
    - { time: 60,  rate: 1.2 }
    - { time: 120, rate: 0.8 }
    - { time: 240, rate: 0.6 }
    - { time: 360, rate: 0.9 }
    - { time: 480, rate: 0.4 }
    - { time: 540, rate: 0.2 }
    - { time: 600, rate: 0.1 }

event_conditions: null

availability_overrides:
  closed_gates: []
  closed_parking_lots: []
  closed_roads: []
  timed_closures:
    - entity_type: gate
      entity_id: vitap-gate-main
      start_tick: 45    # 08:45
      end_tick: 105     # 09:45

prediction_error_injection_level: 0.0
random_seed: 44
warmdown_minutes: 30

# use_prediction / use_optimization / use_uncertainty / proactive are not yet
# read by the engine (pending Member 3). Set here for forward compatibility.
use_prediction: true
use_optimization: true
use_uncertainty: true
proactive: true
