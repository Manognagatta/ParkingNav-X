# S9: Scale 1000 — scalability test with 1000 vehicles, full 600-min run.
# Lot total capacity is 540 (P1=120 P2=180 P3=80 P4=100 P5=60); ~460 will overflow.
# Overflow events are expected and measured. Verify runtime and conservation.
scenario_id: vitap-scale-1000
campus_id: vitap
name: SCALE_1000
description: "Scalability test: 1000 vehicles, 600-min run. Overflow expected; verify runtime and conservation."
duration_minutes: 600
vehicle_count: 1000
start_time_min: 480

arrival_rate_profile:
  type: profile
  points:
    - { time: 0,   rate: 0.5 }
    - { time: 60,  rate: 2.5 }
    - { time: 120, rate: 1.8 }
    - { time: 240, rate: 1.2 }
    - { time: 360, rate: 1.5 }
    - { time: 480, rate: 0.8 }
    - { time: 540, rate: 0.3 }
    - { time: 600, rate: 0.1 }

event_conditions: null

availability_overrides:
  closed_gates: []
  closed_parking_lots: []
  closed_roads: []

prediction_error_injection_level: 0.0
random_seed: 7
warmdown_minutes: 30
use_prediction: true
use_optimization: true
use_uncertainty: true
proactive: true
