# E5 Robustness: 10% forecast noise (ε ~ N(0, 0.10))
scenario_id: vitap-e5-noise-10
campus_id: vitap
name: ROBUSTNESS_10PCT_NOISE
description: "Normal day with 10% forecast error injection (σ=0.10)"
duration_minutes: 180
vehicle_count: 60

arrival_rate_profile:
  type: profile
  points:
    - { time: 0, rate: 0.15 }
    - { time: 45, rate: 0.55 }
    - { time: 90, rate: 0.35 }
    - { time: 150, rate: 0.1 }

event_conditions: null
availability_overrides:
  closed_gates: []
  closed_parking_lots: []
  closed_roads: []

prediction_error_injection_level: 0.10
random_seed: 51

use_prediction: true
use_optimization: true
use_uncertainty: true
proactive: true
