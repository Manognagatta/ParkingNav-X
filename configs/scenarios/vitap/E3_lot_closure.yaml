# E3: Parking lot closure during peak hours
# Tests: overflow response, diversion to other lots
scenario_id: vitap-lot-closure
campus_id: vitap
name: LOT_CLOSURE
description: "Lot A closed 9:00-11:00 (peak hours), vehicles diverted"
duration_minutes: 180
vehicle_count: 80

arrival_rate_profile:
  type: profile
  points:
    - { time: 0, rate: 0.15 }
    - { time: 45, rate: 0.55 }  # 8:45 AM (peak)
    - { time: 90, rate: 0.35 }  # 10:30 AM (still disrupted)
    - { time: 150, rate: 0.1 }

event_conditions: null

# Disruption: close Lot 1 throughout scenario (time-based closures are future work)
availability_overrides:
  closed_gates: []
  closed_parking_lots:
    - vitap-lot-1
  closed_roads: []

prediction_error_injection_level: 0.0
random_seed: 43

use_prediction: true
use_optimization: true
use_uncertainty: true
proactive: true
