# S10 — Real-Day Replay scenario.
#
# Arrival profile and vehicle count are calibrated from the Part 8
# observation sheet (data/observations/vitap_observations.csv).
# Source data is synthetic (labeled); replace arrival_rate_profile
# points with values fitted from actual gate counts before final submission.
#
# Gate counts observed (2024-01-15, normal day):
#   08:00-12:00  morning rush, ~40 veh/15-min peak at main gate
#   12:00-14:00  midday lull
#   14:00-18:00  afternoon session
# vehicle_count derived from sum of vehicle_count column (normal day rows).
#
# To replay an event day: set event_conditions and use E2 arrival profile.

scenario_id: vitap-real-day-replay
campus_id: vitap
name: S10_REAL_DAY_REPLAY
duration_minutes: 600
vehicle_count: 370
start_time_min: 480
arrival_rate_profile:
  type: profile
  # Fitted from observed gate vehicle_count (15-min bins, 08:00–18:00).
  # Points are relative rates; engine normalises to vehicle_count total.
  points:
    - { time: 0,   rate: 0.4 }   # 08:00 early arrivals
    - { time: 30,  rate: 1.1 }   # 08:30 morning rush starts
    - { time: 60,  rate: 1.5 }   # 09:00 peak
    - { time: 90,  rate: 1.3 }   # 09:30
    - { time: 120, rate: 0.9 }   # 10:00 post-peak
    - { time: 180, rate: 0.6 }   # 11:00 mid-morning
    - { time: 240, rate: 0.5 }   # 12:00 lunch lull
    - { time: 300, rate: 0.7 }   # 13:00 afternoon session
    - { time: 360, rate: 1.0 }   # 14:00 afternoon rush
    - { time: 420, rate: 0.8 }   # 15:00
    - { time: 480, rate: 0.4 }   # 16:00 departures begin
    - { time: 540, rate: 0.2 }   # 17:00 tail
    - { time: 600, rate: 0.1 }   # 18:00 close
event_conditions: null
availability_overrides:
  closed_gates: []
  closed_parking_lots: []
  closed_roads: []
prediction_error_injection_level: 0.0
random_seed: 42
warmdown_minutes: 30
