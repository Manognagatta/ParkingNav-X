# Gate congestion scenario: burst arrivals overwhelm gate throughput
scenario_id: vitap-gate-congestion
campus_id: vitap
name: GATE_CONGESTION
description: "Sudden burst arrival causes gate queue build-up; measures queue depth and wait time"
duration_minutes: 180
vehicle_count: 400
start_time_min: 480
arrival_rate_profile:
  type: profile
  points:
    - { time: 0, rate: 0.2 }
    - { time: 30, rate: 4.0 }   # sudden burst
    - { time: 60, rate: 4.0 }
    - { time: 90, rate: 1.0 }
    - { time: 180, rate: 0.3 }

event_conditions: null
availability_overrides:
  closed_gates: []
  closed_parking_lots: []
  closed_roads: []

prediction_error_injection_level: 0.0
random_seed: 55
use_prediction: true
use_optimization: true
use_uncertainty: true
proactive: true
