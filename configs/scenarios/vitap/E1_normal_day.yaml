# SYNTHETIC scenario. Vehicle arrivals/timing/dwell are simulated, not
# measured VIT-AP behavior. Destination names are real (see PROVENANCE.md).
scenario_id: vitap-normal-day
campus_id: vitap
name: NORMAL_DAY
duration_minutes: 600
vehicle_count: 400
start_time_min: 480
arrival_rate_profile:
  type: profile
  points:
    - { time: 0, rate: 0.3 }
    - { time: 60, rate: 1.2 }
    - { time: 120, rate: 0.8 }
    - { time: 240, rate: 0.6 }
    - { time: 360, rate: 0.9 }
    - { time: 480, rate: 0.4 }
    - { time: 540, rate: 0.2 }
    - { time: 600, rate: 0.1 }
event_conditions: null
availability_overrides:
  closed_gates: []
  closed_parking_lots: []
  closed_roads: []
prediction_error_injection_level: 0.0
random_seed: 7
warmdown_minutes: 30
