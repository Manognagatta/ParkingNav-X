# SYNTHETIC scalability scenario: 1000 vehicles over a 10-hour day
# (08:00-18:00) with morning and evening peaks.
scenario_id: vitap-scale-1000
campus_id: vitap
name: SCALE_1000
description: Scalability run with 1000 vehicles over 08:00-18:00.
duration_minutes: 600
vehicle_count: 1000
arrival_rate_profile:
  type: profile
  points:
    - { time: 0, rate: 0.6 }
    - { time: 60, rate: 1.0 }
    - { time: 180, rate: 0.4 }
    - { time: 300, rate: 0.6 }
    - { time: 480, rate: 0.3 }
    - { time: 600, rate: 0.1 }
event_conditions: null
availability_overrides:
  closed_gates: []
  closed_parking_lots: []
  closed_roads: []
prediction_error_injection_level: 0.0
dwell_minutes: { min: 60, max: 300 }
random_seed: 1000
