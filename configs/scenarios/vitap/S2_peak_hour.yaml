# S2: Peak Hour — sharp morning surge 08:00–09:30, then normal day.
# Demand spikes to 2.0 veh/min at 08:30 (tick 30), drains by 09:30 (tick 90).
# vehicle_count=480 reflects the concentrated morning burst on top of normal day.
# Verify: sharp occupancy rise 08:00-09:30, gate queue spikes during surge.
scenario_id: vitap-peak-hour
campus_id: vitap
name: PEAK_HOUR
description: "Morning surge 08:00-09:30 (2.0x normal peak rate); queue spike expected at main gate."
duration_minutes: 600
vehicle_count: 480
start_time_min: 480

arrival_rate_profile:
  type: profile
  points:
    - { time: 0,   rate: 0.3 }   # 08:00 — low as campus opens
    - { time: 30,  rate: 2.0 }   # 08:30 — sharp peak surge
    - { time: 90,  rate: 2.2 }   # 09:30 — peak continues
    - { time: 120, rate: 1.0 }   # 10:00 — surge drains
    - { time: 180, rate: 0.6 }   # 11:00 — back to normal
    - { time: 240, rate: 0.6 }
    - { time: 360, rate: 0.9 }
    - { time: 480, rate: 0.4 }
    - { time: 540, rate: 0.2 }
    - { time: 600, rate: 0.1 }

event_conditions: null

availability_overrides:
  closed_gates: []
  closed_parking_lots: []
  closed_roads: []

prediction_error_injection_level: 0.0
random_seed: 7
warmdown_minutes: 30
use_prediction: true
use_optimization: true
use_uncertainty: true
proactive: true
